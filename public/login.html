<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to ReserveEase - Access your reservations and bookings">
    <title>Login - ReserveEase</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to manage your reservations</p>
            </div>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register.html">Create one</a></p>
                <p style="margin-top: 10px;"><a href="/" style="color: var(--gray-400); font-weight: 400;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        initAuthPage();

        // Check if loading on port 3000 (Admin port)
        if (window.location.port === '3000') {
            document.querySelector('.auth-logo h1').textContent = 'Admin Portal';
            document.querySelector('.auth-logo p').textContent = 'Sign in with administrative credentials';
            document.getElementById('email').value = 'admin@reservations.com';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> Signing in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showToast('Please enter email and password', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
                return;
            }

            const res = await API.post('/auth/login', { email, password });

            if (res.ok && res.data.success) {
                showToast('Login successful!', 'success');
                const user = res.data.user;
                setTimeout(() => {
                    if (user.role === 'admin') {
                        window.location.href = `http://${window.location.hostname}:3000/admin/dashboard.html`;
                    } else {
                        window.location.href = `http://${window.location.hostname}:3030/customer-dashboard.html`;
                    }
                }, 400);
            } else {
                showToast(res.data.message || 'Login failed', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
            }
        });
    </script>
</body>
</html>
